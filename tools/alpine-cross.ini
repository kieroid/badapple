# Meson cross file for the Alpine aarch64 sysroot. "make rootfs" fills in
# @SYSROOT@, @RUSTC@ and @TOOLS@.
[binaries]
c = ['clang', '--target=aarch64-alpine-linux-musl', '--sysroot=@SYSROOT@']
cpp = ['clang++', '--target=aarch64-alpine-linux-musl', '--sysroot=@SYSROOT@']
rust = ['@RUSTC@', '--target', 'aarch64-unknown-linux-musl', '-C', 'link-arg=-fuse-ld=lld', '-C', 'target-feature=-crt-static']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'
llvm-config = '@TOOLS@/alpine-llvm-config'

[built-in options]
pkg_config_path = ''
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']

[properties]
sys_root = '@SYSROOT@'
pkg_config_libdir = '@SYSROOT@/usr/lib/pkgconfig:@SYSROOT@/usr/share/pkgconfig'
bindgen_clang_arguments = ['--target=aarch64-alpine-linux-musl', '--sysroot=@SYSROOT@']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
