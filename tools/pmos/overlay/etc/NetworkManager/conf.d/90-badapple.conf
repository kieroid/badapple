# The ramdisk sets up usb0 as 172.16.42.1 before switch_root; leave it alone.
[device-usb0]
match-device=interface-name:usb0
managed=false

# The BCM4377 firmware refuses MAC changes (-EBADE), so no random MACs.
[device-wifi-mac]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

[connection-wifi-mac]
match-device=interface-name:wlan0
wifi.cloned-mac-address=permanent
